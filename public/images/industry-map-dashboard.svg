  <rect x="350" y="140" width="30" height="60" fill="#0099ff" opacity="0.8" rx="2"/>
  <rect x="390" y="110" width="30" height="90" fill="#00d4ff" opacity="0.8" rx="2"/>
  <rect x="430" y="160" width="30" height="40" fill="#0066cc" opacity="0.8" rx="2"/>
  <rect x="470" y="175" width="30" height="25" fill="#004499" opacity="0.8" rx="2"/>

