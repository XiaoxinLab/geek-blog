  <circle cx="110" cy="350" r="55" fill="none" stroke="#0099ff" stroke-width="20" stroke-dasharray="69 276" stroke-dashoffset="-138" transform="rotate(-90 110 350)"/>
  <circle cx="110" cy="350" r="55" fill="none" stroke="#0066cc" stroke-width="20" stroke-dasharray="46 299" stroke-dashoffset="-207" transform="rotate(-90 110 350)"/>

