  <text x="140" y="95" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#00d4ff" text-anchor="middle">市场主体总数</text>

  <!-- Big number display -->
  <rect x="50" y="110" width="180" height="50" rx="4" fill="#0a1525" stroke="#00d4ff" stroke-width="1"/>
  <text x="70" y="143" font-family="Courier New, monospace" font-size="28" font-weight="bold" fill="#00d4ff" filter="url(#glow)">3</text>
  <text x="95" y="143" font-family="Courier New, monospace" font-size="28" font-weight="bold" fill="#00d4ff" filter="url(#glow)">1</text>
  <text x="120" y="143" font-family="Courier New, monospace" font-size="28" font-weight="bold" fill="#00d4ff" filter="url(#glow)">1</text>
  <text x="145" y="143" font-family="Courier New, monospace" font-size="28" font-weight="bold" fill="#00d4ff" filter="url(#glow)">3</text>
