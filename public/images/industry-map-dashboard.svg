  <text x="765" y="385" font-family="Arial, sans-serif" font-size="10" fill="#00d4ff" text-anchor="end">1家</text>

  <text x="620" y="405" font-family="Arial, sans-serif" font-size="11" fill="#7aa3cc">23</text>
  <text x="640" y="405" font-family="Arial, sans-serif" font-size="10" fill="#ffffff">绿色农副产品加工</text>
  <text x="765" y="405" font-family="Arial, sans-serif" font-size="10" fill="#00d4ff" text-anchor="end">1家</text>

  <text x="620" y="425" font-family="Arial, sans-serif" font-size="11" fill="#7aa3cc">1</text>
  <text x="640" y="425" font-family="Arial, sans-serif" font-size="10" fill="#00d4ff" font-weight="bold">批发和零售业</text>
  <text x="765" y="425" font-family="Arial, sans-serif" font-size="10" fill="#00d4ff" font-weight="bold" text-anchor="end">11935家</text>

  <!-- Decorative corner elements -->
