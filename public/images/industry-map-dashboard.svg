  <text x="40" y="210" font-family="Arial, sans-serif" font-size="12" fill="#7aa3cc">个体工商户</text>
  <text x="200" y="210" font-family="Arial, sans-serif" font-size="12" fill="#00d4ff" text-anchor="end">23840 家</text>

