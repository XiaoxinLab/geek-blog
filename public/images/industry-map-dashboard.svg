  <text x="765" y="305" font-family="Arial, sans-serif" font-size="10" fill="#00d4ff" text-anchor="end">52家</text>

  <text x="620" y="325" font-family="Arial, sans-serif" font-size="11" fill="#7aa3cc">19</text>
