  <text x="365" y="215" font-family="Arial, sans-serif" font-size="10" fill="#7aa3cc" text-anchor="middle">小型</text>
  <text x="405" y="215" font-family="Arial, sans-serif" font-size="10" fill="#7aa3cc" text-anchor="middle">中型</text>
  <text x="445" y="215" font-family="Arial, sans-serif" font-size="10" fill="#7aa3cc" text-anchor="middle">大型</text>
