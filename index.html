<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />

    <!-- SEO 和分享用的标签，页面切换时会由 router 更新 -->
    <meta name="description" content="七岁的前端技术笔记，记录 Vue、React、TypeScript、Node.js 等技术栈的实践与踩坑。" />
    <meta name="author" content="七岁" />
    <link rel="canonical" href="https://qisui.asia/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="QiSui.BLOG" />
    <meta property="og:title" content="QiSui.BLOG" />
    <meta property="og:description" content="七岁的前端技术笔记，记录 Vue、React、TypeScript、Node.js 等技术栈的实践与踩坑。" />
    <meta property="og:url" content="https://qisui.asia/" />

    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" type="image/svg+xml" href="/iconfont.svg" />
    <script>
      (function() {
        var stored = localStorage.getItem('theme-dark');
        var isDark = stored === null ? true : stored === 'true';
        document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
